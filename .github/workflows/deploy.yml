name: Deploy to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            BASE_HREF="/"
          else
            BASE_HREF="/${REPO_NAME}/"
          fi
          echo "BASE_HREF=$BASE_HREF" >> $GITHUB_ENV
          npm run build -- --configuration production --base-href "$BASE_HREF"

      - run: |
          DIST_DIR="$(ls -d dist/*/browser 2>/dev/null | head -n 1)"
          if [ -z "$DIST_DIR" ]; then
            DIST_DIR="$(ls -d dist/* | head -n 1)"
          fi

          echo "DIST_DIR=$DIST_DIR" >> $GITHUB_ENV

          echo "Using DIST_DIR=$DIST_DIR"
          ls -la "$DIST_DIR"
          test -f "$DIST_DIR/index.html"

          if [ ! -f "$DIST_DIR/404.html" ]; then
            cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"
          fi
          touch "$DIST_DIR/.nojekyll"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.DIST_DIR }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
