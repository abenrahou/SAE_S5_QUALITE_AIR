name: Deploy to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # IMPORTANT: base-href = /NOM_DU_REPO/
      - run: npm run build -- --configuration production --base-href "/SAE_S5_QUALITE_AIR/"

      # SPA fallback (utile si tu as du routing Angular)
      - run: |
          DIST_DIR="$(ls -d dist/* | head -n 1)"
          cp "$DIST_DIR/index.html" "$DIST_DIR/404.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
