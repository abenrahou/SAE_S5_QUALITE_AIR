<header
  [class]="sidebarState.isCollapsed()
    ? 'header fixed top-0 right-0 left-20 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 z-30 px-6 py-4'
    : 'header fixed top-0 right-0 left-64 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-700 z-30 px-6 py-4'">
  <div class="flex items-center justify-between">
    <!-- Title / Breadcrumb -->
    <div>
      <h1 class="text-xl font-bold text-gray-800 dark:text-gray-100">
        Analyse Qualité de l'Air 2019-2023
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        101 villes • 73 pays • 6 continents
      </p>
    </div>

    <!-- Search & Actions -->
    <div class="flex items-center space-x-4">
      <!-- Search Bar (optionnel, peut être commenté si pas implémenté) -->
      <!--
      <div class="relative">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()"
          placeholder="Rechercher une ville..."
          class="px-4 py-2 pl-10 rounded-lg border border-gray-300 dark:border-gray-600 bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500">
        <span class="absolute left-3 top-2.5 text-gray-400">🔍</span>
      </div>
      -->

      <!-- User Icon (placeholder) -->
      <div class="w-10 h-10 rounded-full bg-blue-100 dark:bg-blue-900 flex items-center justify-center text-blue-600 dark:text-blue-400">
        <span class="font-bold">U</span>
      </div>
    </div>
  </div>
</header>
