<!-- Loading State -->
@if (isLoading()) {
  <div class="fixed inset-0 bg-white dark:bg-gray-900 flex items-center justify-center z-50">
    <div class="text-center">
      <svg class="w-16 h-16 mx-auto mb-4 animate-bounce text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h2 class="text-2xl font-bold text-gray-800 dark:text-gray-100 mb-2">
        Chargement des données...
      </h2>
      <p class="text-gray-600 dark:text-gray-400">
        Veuillez patienter
      </p>
      <div class="mt-6 flex justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
      </div>
    </div>
  </div>
} @else if (loadError()) {
  <!-- Error State -->
  <div class="fixed inset-0 bg-white dark:bg-gray-900 flex items-center justify-center z-50 p-8">
    <div class="max-w-2xl bg-red-50 dark:bg-red-900/20 border-2 border-red-200 dark:border-red-800 rounded-lg p-8 text-center">
      <svg class="w-16 h-16 mx-auto mb-4 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      <h2 class="text-2xl font-bold text-red-800 dark:text-red-200 mb-4">
        Erreur de chargement
      </h2>
      <p class="text-red-700 dark:text-red-300 mb-6">
        {{ loadError() }}
      </p>
      <button
        (click)="reload()"
        class="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
        Réessayer
      </button>
    </div>
  </div>
} @else {
  <!-- Main Layout (shown when data is loaded) -->
  <div class="app-container">
    <!-- Sidebar -->
    <app-sidebar></app-sidebar>

    <!-- Main Content Area -->
    <div
      [class]="sidebarState.isCollapsed()
        ? 'main-content ml-20 min-h-screen bg-gray-50 dark:bg-gray-800'
        : 'main-content ml-64 min-h-screen bg-gray-50 dark:bg-gray-800'">
      <!-- Header -->
      <app-header></app-header>

      <!-- Page Content -->
      <main class="pt-20 pb-12 px-6">
        <router-outlet></router-outlet>
      </main>

      <!-- Footer -->
      <app-footer></app-footer>
    </div>
  </div>
}
